spring.application.name=hgest
logging.level.org.springframework=info

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:0000/hgest
spring.datasource.username=postgres
spring.datasource.password=super_secret_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=change_me_to_a_random_string_of_at_least_32_chars
jwt.expiration=3600000

# initial DEV user, only created when the user table is empty
hgest.bootstrap.username=admin
hgest.bootstrap.password=super_secret_admin_password
