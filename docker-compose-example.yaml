services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      # localhost only, so you can still run the API from your IDE (jdbc:...:3030/hgest)
      - "127.0.0.1:3030:5432"
    volumes:
      - hgest-pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hgest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hgest"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Spring maps these onto the matching application.properties keys
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hgest
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-14400000}
      HGEST_BOOTSTRAP_USERNAME: ${HGEST_BOOTSTRAP_USERNAME:-}
      HGEST_BOOTSTRAP_PASSWORD: ${HGEST_BOOTSTRAP_PASSWORD:-}
      HGEST_CORS_ALLOWED_ORIGINS: ${HGEST_CORS_ALLOWED_ORIGINS:-}

volumes:
  hgest-pg-data:
    labels:
      com.example.description: "Database volume for hgest"
