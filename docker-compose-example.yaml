services:
  db:
    image: postgres:17
    ports:
      - "3030:5432"
    volumes:
      - hgest-pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "super_secret_password"
      POSTGRES_DB: hgest
volumes:
  hgest-pg-data:
    labels:
      com.example.description: "Database volume for hgest"
